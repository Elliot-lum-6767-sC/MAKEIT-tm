<!DOCTYPE html>
<html>
<body style="background:#222; color:white; text-align:center; font-family:Arial;">



// Creator says,  Hey, what are you even doing here? close the inspect tab NOW!!!!!! 



<h1>PONG (AI) V1.3.7</h1>
<p>Arrow keys to move | P to pause | Hold T for TURBO MODE | Press 6 for DUCK 🦆 | Press 1 for ANOTHER BALL</p>

<canvas id="game" width="800" height="400"
style="background:black; border:3px solid white;">
</canvas>

<script>

let canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");

let playerY = 150;
let aiY = 150;


// BALLS
let balls = [
    {
        x: 395,
        y: 195,
        vx: 5,
        vy: 3
    }
];


let keyese = {};
let paused = false;

let playerScore = 0;
let aiScore = 0;
let duckBall = false;


// EASTER EGG SOUND TIMER
let soundTimer = 0;
let nextSound = 60 + Math.random() * 120;


// DUCK EASTER EGG
let duckVisible = false;
let duckX = 0;
let duckY = 0;
let duckTimer = 0;


// GIANT BALL EASTER EGG
let giantBall = false;
let giantBallTimer = 0;


// MESSAGE EASTER EGG
let secretMessage = "";
let secretMessageTimer = 0;


// CONTROLS
document.onkeydown = function(e) {

    keyese[e.key.toLowerCase()] = true;


    // ANOTHER BALL — 1
    if (e.key === "1") {

        balls.push({
            x: 395,
            y: 195,
            vx: Math.random() < 0.5 ? 5 : -5,
            vy: (Math.random() * 6) - 3
        });

        secretMessage = "ANOTHER BALL!!!";
        secretMessageTimer = 1;
    }


    // DUCK BALL — 7
    if (e.key === "7") {
        duckBall = !duckBall;
    }


    // Pause — P
    if (e.key.toLowerCase() === "p") {
        paused = !paused;
    }


    // DUCK — 6
    if (e.key === "6") {

        duckVisible = true;

        duckX = 50 + Math.random() * 700;
        duckY = 100 + Math.random() * 250;

        duckTimer = 2;
    }


    // GIANT BALL — 0
    if (e.key === "0") {

        giantBall = true;
        giantBallTimer = 3;
    }


    // WHY — ?
    if (e.key === "?") {

        secretMessage = 'Why are you even playing this very trippy game? ("67")';
        secretMessageTimer = 3;
    }


    // DEATH PARTICLE — I
    if (e.key.toLowerCase() === "i") {

        secretMessage = "💀";
        secretMessageTimer = 1;
    }


    // CHICKEN — C
    if (e.key.toLowerCase() === "c") {

        secretMessage = "🐔";
        secretMessageTimer = 2;
    }
};


document.onkeyup = function(e) {
    keyese[e.key.toLowerCase()] = false;
};


// RANDOM SOUND
function randomSound() {

    let audioContext =
        new (window.AudioContext || window.webkitAudioContext)();

    let oscillator = audioContext.createOscillator();
    let gain = audioContext.createGain();

    oscillator.frequency.value = 180;
    oscillator.type = "square";

    gain.gain.value = 0.05;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    setTimeout(function() {
        oscillator.stop();
    }, 120);
}


// RESET BALL
function resetBall(ball, direction) {

    ball.x = 395;
    ball.y = 195;

    ball.vx = direction * 5;
    ball.vy = (Math.random() * 6) - 3;
}


// GAME
function game() {

    if (!paused) {


        // EASTER EGG SOUND TIMER
        soundTimer += 1 / 60;

        if (soundTimer >= nextSound) {

            randomSound();

            soundTimer = 0;
            nextSound = 60 + Math.random() * 120;
        }


        // DUCK TIMER
        if (duckVisible) {

            duckTimer -= 1 / 60;

            if (duckTimer <= 0) {
                duckVisible = false;
            }
        }


        // GIANT BALL TIMER
        if (giantBall) {

            giantBallTimer -= 1 / 60;

            if (giantBallTimer <= 0) {
                giantBall = false;
            }
        }


        // MESSAGE TIMER
        if (secretMessageTimer > 0) {

            secretMessageTimer -= 1 / 60;

            if (secretMessageTimer <= 0) {
                secretMessage = "";
            }
        }


        // TURBO MODE
        let speedMultiplier = keyese["t"] ? 2 : 1;


        // PLAYER
        if (keyese["arrowup"])
            playerY -= 6 * speedMultiplier;

        if (keyese["arrowdown"])
            playerY += 6 * speedMultiplier;

        if (playerY < 0) playerY = 0;
        if (playerY > 320) playerY = 320;


        // AI
        // AI follows the ball that is closest to the right side
        let targetBall = balls[0];

        for (let i = 0; i < balls.length; i++) {

            if (balls[i].x > targetBall.x) {
                targetBall = balls[i];
            }
        }


        if (targetBall.x > 400) {

            if (aiY + 40 < targetBall.y - 20)
                aiY += 2.5 * speedMultiplier;

            if (aiY + 40 > targetBall.y + 20)
                aiY -= 2.5 * speedMultiplier;
        }

        if (aiY < 0) aiY = 0;
        if (aiY > 320) aiY = 320;


        // ALL BALLS
        for (let i = balls.length - 1; i >= 0; i--) {

            let ball = balls[i];


            // MOVE
            ball.x += ball.vx * speedMultiplier;
            ball.y += ball.vy * speedMultiplier;


            // TOP / BOTTOM
            if (ball.y <= 0 || ball.y >= 390) {
                ball.vy *= -1;
            }


            // PLAYER PADDLE
            if (
                ball.x <= 70 &&
                ball.x >= 50 &&
                ball.y + 10 >= playerY &&
                ball.y <= playerY + 80 &&
                ball.vx < 0
            ) {
                ball.vx = 5;
            }


            // AI PADDLE
            if (
                ball.x + 10 >= 730 &&
                ball.x <= 750 &&
                ball.y + 10 >= aiY &&
                ball.y <= aiY + 80 &&
                ball.vx > 0
            ) {
                ball.vx = -5;
            }


            // AI MISSES
            if (ball.x < -10) {

                playerScore++;

                resetBall(ball, 1);
            }


            // PLAYER MISSES
            if (ball.x > 810) {

                aiScore++;

                resetBall(ball, -1);
            }
        }
    }


    // DRAW
    ctx.clearRect(0, 0, 800, 400);

    ctx.fillStyle = "white";


    // PLAYER PADDLE
    ctx.fillRect(50, playerY, 20, 80);


    // AI PADDLE
    ctx.fillRect(730, aiY, 20, 80);


    // ALL BALLS
    for (let i = 0; i < balls.length; i++) {

        let ball = balls[i];


        if (duckBall) {

            ctx.font = giantBall ? "90px Arial" : "30px Arial";

            ctx.fillText(
                "🦆",
                ball.x,
                ball.y + (giantBall ? 70 : 25)
            );

        } else {

            if (giantBall) {

                ctx.fillRect(
                    ball.x - 35,
                    ball.y - 35,
                    80,
                    80
                );

            } else {

                ctx.fillRect(
                    ball.x,
                    ball.y,
                    10,
                    10
                );
            }
        }
    }


    // MIDDLE LINE
    for (let y = 0; y < 400; y += 20) {
        ctx.fillRect(398, y, 4, 10);
    }


    // SCORE
    ctx.font = "50px Arial";
    ctx.textAlign = "center";

    // LEFT = AI
    ctx.fillText(aiScore, 300, 60);

    // RIGHT = PLAYER
    ctx.fillText(playerScore, 500, 60);


    // BALL COUNT
    if (balls.length > 1) {

        ctx.font = "20px Arial";
        ctx.fillText(
            "BALLS: " + balls.length,
            400,
            25
        );
    }


    // TURBO MODE TEXT
    if (keyese["t"] && !paused) {

        ctx.font = "25px Arial";
        ctx.fillText("TURBO MODE", 400, 100);
    }


    // DUCK 🦆
    if (duckVisible) {

        ctx.font = "45px Arial";
        ctx.fillText("🦆", duckX, duckY);
    }


    // SECRET MESSAGE
    if (secretMessage !== "") {

        ctx.font = "30px Arial";
        ctx.fillText(secretMessage, 400, 350);
    }


    // PAUSE
    if (paused) {

        ctx.font = "50px Arial";
        ctx.fillText("PAUSED", 400, 190);

        ctx.font = "22px Arial";
        ctx.fillText("Press P to continue", 400, 230);
    }


    ctx.textAlign = "left";

    requestAnimationFrame(game);
}

game();

</script>

</body>
</html>
